# Tailwind Ground Control — user documentation site (MkDocs Material).
#
# Single-version model (Tailwind simplification of the upstream mike setup): the docs on
# master ARE the current docs. A push to master that touches the docs builds the site and
# publishes it to the gh-pages branch root, which GitHub Pages serves at
# https://retrorix.github.io/Tailwind-GC/
#
# Local preview: pip install -r docs/requirements.txt, then `mkdocs serve`.

name: docs

on:
  push:
    branches: [master]
    paths:
      - 'docs/user/**'
      - 'mkdocs.yml'
      - 'overrides/**'
      - 'docs/requirements.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

# Allow only one concurrent deployment — parallel gh-pages pushes would race.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
